name: EAS Submission Status

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/eas-submit-status.yml"

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      CI: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install dependencies
        run: npm ci
      - name: Inspect latest Android submission and logs
        run: |
          npx --yes eas-cli@latest submit:list --platform android --limit 10 --json --non-interactive > /tmp/android-submissions.json
          cat /tmp/android-submissions.json
          node - <<'NODE' > /tmp/android-log-urls.txt
          const fs = require('fs');
          const submissions = JSON.parse(fs.readFileSync('/tmp/android-submissions.json', 'utf8'));
          for (const url of (submissions[0]?.logFiles || [])) console.log(url);
          NODE
          while IFS= read -r url; do
            [ -z "$url" ] && continue
            echo "===== LATEST ANDROID SUBMISSION LOG ====="
            curl -fsSL "$url" || true
            echo
          done < /tmp/android-log-urls.txt
      - name: Check Android store status
        run: npx --yes eas-cli@latest submit:status --platform android --json --non-interactive || true
      - name: List recent iOS submissions
        run: npx --yes eas-cli@latest submit:list --platform ios --limit 10 --json --non-interactive
