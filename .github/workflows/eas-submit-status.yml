name: EAS Submission Status

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/eas-submit-status.yml"

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      CI: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install dependencies
        run: npm ci
      - name: Decode newest failed Android submission log
        run: |
          npx --yes eas-cli@latest submit:list --platform android --limit 10 --json --non-interactive > /tmp/android.json
          echo "===== CURRENT SUBMISSIONS ====="
          jq -r '.[] | [.id,.status,.createdAt,.completedAt] | @tsv' /tmp/android.json
          url=$(jq -r '[.[] | select(.status=="ERRORED")][0].logFiles[-1]' /tmp/android.json)
          curl -fsSL "$url" -o /tmp/eas-failure.bin
          node -e "const fs=require('fs'),z=require('zlib'); const b=fs.readFileSync('/tmp/eas-failure.bin'); try{const o=z.brotliDecompressSync(b);fs.writeFileSync('/tmp/eas-failure.txt',o);console.log('BROTLI_OK',o.length)}catch(e){console.log('BROTLI_FAILED',e.message)}"
          if [ -f /tmp/eas-failure.txt ]; then
            echo "===== DECODED FAILURE LOG ====="
            tail -n 250 /tmp/eas-failure.txt
          else
            echo "No decoded log produced"
          fi
