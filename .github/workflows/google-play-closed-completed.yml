name: Google Play Closed Testing Release

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/google-play-closed-completed.yml"

permissions:
  contents: read

jobs:
  submit-closed:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      CI: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install dependencies
        run: npm ci
      - name: Verify Expo authentication
        run: |
          test -n "$EXPO_TOKEN"
          npx --yes eas-cli@latest whoami
          npx --yes eas-cli@latest init --id 620ef3a3-d92c-4241-86bb-511817c9d3cb --non-interactive
      - name: Configure closed testing submission
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const p = 'eas.json';
          const json = JSON.parse(fs.readFileSync(p, 'utf8'));
          json.submit ||= {};
          json.submit.closed ||= {};
          json.submit.closed.android = {
            track: 'alpha',
            releaseStatus: 'completed',
            changesNotSentForReview: false
          };
          fs.writeFileSync(p, JSON.stringify(json, null, 2) + '\n');
          NODE
      - name: Submit latest Android build to closed testing
        run: npx --yes eas-cli@latest submit --platform android --latest --profile closed --non-interactive --wait
