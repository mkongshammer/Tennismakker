name: App Store screenshots

# Puts mobile/store/out/ios/*.png on the App Store listing (iPhone 6.7").
#
# Apple keeps screenshots on a version, and only a version that is still being
# prepared can be changed — a version waiting for review or already on sale
# cannot. The job says which it found and stops rather than guessing.
#
# Upload is three steps per picture: reserve it, PUT the bytes to the URL
# Apple hands back, then commit it with the file's MD5 as proof.

on:
  workflow_dispatch:
    inputs:
      locale:
        description: "Listing language to update"
        default: "en-US"
        required: false
      replace:
        description: "Remove the screenshots already there first"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
      ASC_APP_ID: "6820186123"
      LOCALE: ${{ inputs.locale || 'en-US' }}
      REPLACE: ${{ inputs.replace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Upload screenshots
        run: |
          node - <<'NODE'
          const crypto = await import('node:crypto').then((m) => m.default);
          const fs = await import('node:fs').then((m) => m.default);
          const path = await import('node:path').then((m) => m.default);

          const b64 = (o) => Buffer.from(JSON.stringify(o)).toString('base64url');
          const now = Math.floor(Date.now() / 1000);
          const head = b64({ alg: 'ES256', kid: process.env.ASC_KEY_ID, typ: 'JWT' });
          const body = b64({ iss: process.env.ASC_ISSUER_ID, iat: now, exp: now + 1200, aud: 'appstoreconnect-v1' });
          const sig = crypto.sign('sha256', Buffer.from(`${head}.${body}`), { key: process.env.ASC_PRIVATE_KEY, dsaEncoding: 'ieee-p1363' }).toString('base64url');
          const jwt = `${head}.${body}.${sig}`;
          const API = 'https://api.appstoreconnect.apple.com';
          const note = (m) => console.log(`::notice::${m}`);

          async function api(method, p, payload) {
            const r = await fetch(p.startsWith('http') ? p : API + p, {
              method,
              headers: { Authorization: `Bearer ${jwt}`, ...(payload ? { 'Content-Type': 'application/json' } : {}) },
              body: payload ? JSON.stringify(payload) : undefined,
            });
            if (r.status === 204) return null;
            const text = await r.text();
            if (!r.ok) {
              if (text.includes('REQUIRED_AGREEMENTS_MISSING_OR_EXPIRED')) {
                throw new Error('Apple is blocking the whole API: an agreement is unsigned or has expired. Accept it in App Store Connect under Business (or Agreements, Tax, and Banking), then run this again.');
              }
              throw new Error(`${method} ${p} → ${r.status} ${text.slice(0, 400)}`);
            }
            return text ? JSON.parse(text) : null;
          }

          const app = process.env.ASC_APP_ID;
          const EDITABLE = new Set(['PREPARE_FOR_SUBMISSION', 'DEVELOPER_REJECTED', 'REJECTED', 'METADATA_REJECTED', 'INVALID_BINARY']);

          const versions = await api('GET', `/v1/apps/${app}/appStoreVersions?limit=10&fields[appStoreVersions]=versionString,appStoreState,platform`);
          const ios = versions.data.filter((v) => v.attributes.platform === 'IOS');
          const version = ios.find((v) => EDITABLE.has(v.attributes.appStoreState));
          if (!version) {
            const states = ios.map((v) => `${v.attributes.versionString} is ${v.attributes.appStoreState}`).join(', ');
            throw new Error(`No version is open for changes right now (${states}). Screenshots belong to a version: either pull the version out of review, or add them to the next version before it is sent in.`);
          }
          note(`Version ${version.attributes.versionString} (${version.attributes.appStoreState})`);

          const locs = await api('GET', `/v1/appStoreVersions/${version.id}/appStoreVersionLocalizations?limit=50&fields[appStoreVersionLocalizations]=locale`);
          const loc = locs.data.find((l) => l.attributes.locale === process.env.LOCALE) ?? locs.data[0];
          if (!loc) throw new Error('That version has no listing language yet.');
          note(`Language ${loc.attributes.locale}`);

          const DISPLAY = 'APP_IPHONE_67'; // 1290×2796, the size Apple asks for
          const sets = await api('GET', `/v1/appStoreVersionLocalizations/${loc.id}/appScreenshotSets?limit=20&fields[appScreenshotSets]=screenshotDisplayType`);
          let set = sets.data.find((s) => s.attributes.screenshotDisplayType === DISPLAY);
          if (!set) {
            set = (await api('POST', '/v1/appScreenshotSets', { data: { type: 'appScreenshotSets', attributes: { screenshotDisplayType: DISPLAY }, relationships: { appStoreVersionLocalization: { data: { type: 'appStoreVersionLocalizations', id: loc.id } } } } } )).data;
            note('Made a new set for iPhone 6.7"');
          }

          if (process.env.REPLACE !== 'false') {
            const old = await api('GET', `/v1/appScreenshotSets/${set.id}/appScreenshots?limit=50`);
            for (const s of old.data) await api('DELETE', `/v1/appScreenshots/${s.id}`);
            if (old.data.length) note(`Removed ${old.data.length} old screenshot(s)`);
          }

          const dir = 'mobile/store/out/ios';
          const files = fs.readdirSync(dir).filter((f) => f.endsWith('.png')).sort();
          if (!files.length) throw new Error(`No pictures in ${dir}`);

          for (const [i, file] of files.entries()) {
            const bytes = fs.readFileSync(path.join(dir, file));
            const reserved = (await api('POST', '/v1/appScreenshots', { data: { type: 'appScreenshots', attributes: { fileName: file, fileSize: bytes.length }, relationships: { appScreenshotSet: { data: { type: 'appScreenshotSets', id: set.id } } } } })).data;
            for (const op of reserved.attributes.uploadOperations) {
              const headers = Object.fromEntries((op.requestHeaders ?? []).map((h) => [h.name, h.value]));
              const part = bytes.subarray(op.offset, op.offset + op.length);
              const r = await fetch(op.url, { method: op.method, headers, body: part });
              if (!r.ok) throw new Error(`Upload of ${file} failed: ${r.status}`);
            }
            await api('PATCH', `/v1/appScreenshots/${reserved.id}`, { data: { type: 'appScreenshots', id: reserved.id, attributes: { uploaded: true, sourceFileChecksum: crypto.createHash('md5').update(bytes).digest('hex') } } });
            note(`${i + 1}/${files.length} ${file}`);
          }
          note('Done. Look them over in App Store Connect before sending the version in.');
          NODE
