name: EAS Build Status

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/eas-build-status.yml"

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install dependencies
        run: npm ci
      - name: List recent iOS builds
        run: npx --yes eas-cli@latest build:list --platform ios --limit 5 --json --non-interactive
