name: EAS iOS Build 5 Robust

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/eas-build-submit-ios-v2.yml"

permissions:
  contents: read

jobs:
  build-submit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
      EXPO_ASC_API_KEY_PATH: /tmp/AuthKey.p8
      EXPO_ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      EXPO_ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      EXPO_APPLE_TEAM_ID: 28H9663B4V
      EXPO_APPLE_TEAM_TYPE: INDIVIDUAL
      CI: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install dependencies
        run: |
          npm ci
          sudo apt-get update -qq
          sudo apt-get install -y -qq expect
      - name: Configure App Store Connect API key
        run: |
          test -n "$EXPO_TOKEN"
          test -n "$ASC_KEY_ID"
          test -n "$ASC_ISSUER_ID"
          test -n "$ASC_PRIVATE_KEY"
          printf '%s' "$ASC_PRIVATE_KEY" > /tmp/AuthKey.p8
          chmod 600 /tmp/AuthKey.p8
          npx --yes eas-cli@latest whoami
      - name: Link EAS project
        run: npx --yes eas-cli@latest init --id 620ef3a3-d92c-4241-86bb-511817c9d3cb --non-interactive
      - name: Verify build number 5
        run: |
          OUT="$(npx --yes eas-cli@latest build:version:get --platform ios --profile app-review --json --non-interactive)"
          echo "$OUT"
          echo "$OUT" | grep -q '"buildNumber": "5"'
      - name: Build iOS build 5 with interactive credential setup
        run: |
          cat > /tmp/eas-build.exp <<'EXPECT'
          log_user 1
          set timeout 2400
          spawn npx --yes eas-cli@latest build --platform ios --profile app-review --wait
          expect {
            -nocase -re {select certificates to revoke} {
              puts "SAFETY_STOP: EAS asked to revoke Apple certificates. Not doing that automatically."
              exit 41
            }
            -nocase -re {maximum number of distribution certificates} {
              puts "SAFETY_STOP: Apple distribution certificate limit reached."
              exit 42
            }
            -nocase -re {generate a new .*distribution certificate} {
              puts "AUTO: generate distribution certificate"
              send "\r"
              exp_continue
            }
            -nocase -re {reuse this distribution certificate} {
              puts "AUTO: reuse distribution certificate"
              send "\r"
              exp_continue
            }
            -nocase -re {select .*distribution certificate.*use} {
              puts "AUTO: select first valid distribution certificate"
              send "\r"
              exp_continue
            }
            -nocase -re {do you want to log in to your apple account} {
              puts "AUTO: authenticate with configured App Store Connect API key"
              send "\r"
              exp_continue
            }
            -nocase -re {set up push notifications} {
              puts "AUTO: set up push notifications"
              send "\r"
              exp_continue
            }
            -nocase -re {generate a new .*push.*key} {
              puts "AUTO: generate push key"
              send "\r"
              exp_continue
            }
            -nocase -re {generate a new .*provisioning.*profile} {
              puts "AUTO: generate provisioning profile"
              send "\r"
              exp_continue
            }
            -nocase -re {use this provisioning profile} {
              puts "AUTO: use provisioning profile"
              send "\r"
              exp_continue
            }
            -nocase -re {select an apple team} {
              puts "AUTO: select Apple team"
              send "\r"
              exp_continue
            }
            -re {[^\r\n]{1,180}\?} {
              puts "AUTO_DEFAULT_PROMPT: $expect_out(0,string)"
              send "\r"
              exp_continue
            }
            eof {
              catch wait result
              set exit_status [lindex $result 3]
              exit $exit_status
            }
            timeout {
              puts "Timed out waiting for EAS build."
              exit 43
            }
          }
          EXPECT
          expect /tmp/eas-build.exp
      - name: Submit build 5 to App Store Connect
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const p = 'eas.json';
          const json = JSON.parse(fs.readFileSync(p, 'utf8'));
          json.submit ||= {};
          json.submit.production ||= {};
          json.submit.production.ios ||= {};
          Object.assign(json.submit.production.ios, {
            ascAppId: '6820186123',
            ascApiKeyPath: '/tmp/AuthKey.p8',
            ascApiKeyIssuerId: process.env.ASC_ISSUER_ID,
            ascApiKeyId: process.env.ASC_KEY_ID
          });
          fs.writeFileSync(p, JSON.stringify(json, null, 2) + '\n');
          NODE
          npx --yes eas-cli@latest submit --platform ios --latest --profile production --non-interactive --wait
