name: Google Play Resubmit Latest

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/google-play-resubmit.yml"

permissions:
  contents: read

jobs:
  resubmit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      CI: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install dependencies
        run: npm ci
      - name: Verify Expo authentication
        run: |
          test -n "$EXPO_TOKEN"
          npx --yes eas-cli@latest whoami
      - name: Link EAS project
        run: npx --yes eas-cli@latest init --id 620ef3a3-d92c-4241-86bb-511817c9d3cb --non-interactive
      - name: Configure Google Play production submission
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const p = 'eas.json';
          const json = JSON.parse(fs.readFileSync(p, 'utf8'));
          json.submit ||= {};
          json.submit.production ||= {};
          json.submit.production.android ||= {};
          Object.assign(json.submit.production.android, {
            track: 'production',
            releaseStatus: 'completed',
            changesNotSentForReview: false
          });
          fs.writeFileSync(p, JSON.stringify(json, null, 2) + '\n');
          NODE
      - name: Retry latest Android submission while Google API propagates
        run: |
          for attempt in $(seq 1 10); do
            echo "Google Play submission attempt $attempt of 10"
            if npx --yes eas-cli@latest submit --platform android --latest --profile production --non-interactive --wait; then
              echo "Submission succeeded"
              exit 0
            fi
            if [ "$attempt" -lt 10 ]; then
              echo "Submission not accepted yet; retrying in 90 seconds"
              sleep 90
            fi
          done
          echo "Submission did not succeed within retry window"
          exit 1
