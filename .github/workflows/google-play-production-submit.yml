name: Google Play Production Submit

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/google-play-production-submit.yml"

permissions:
  contents: read

jobs:
  build-and-submit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      CI: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install dependencies
        run: npm ci
      - name: Verify Expo authentication
        run: |
          test -n "$EXPO_TOKEN"
          npx --yes eas-cli@latest whoami
      - name: Link EAS project
        run: npx --yes eas-cli@latest init --id 620ef3a3-d92c-4241-86bb-511817c9d3cb --non-interactive
      - name: Validate Android configuration
        run: |
          node - <<'NODE'
          const app = require('./app.json').expo;
          if (app.android?.package !== 'dk.racketbuddy.app') throw new Error('Unexpected Android package');
          console.log(`Android package: ${app.android.package}`);
          NODE
          npx expo-doctor
      - name: Build Android production AAB
        run: npx --yes eas-cli@latest build --platform android --profile production --non-interactive --wait
      - name: Configure Google Play production submission
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const p = 'eas.json';
          const json = JSON.parse(fs.readFileSync(p, 'utf8'));
          json.submit ||= {};
          json.submit.production ||= {};
          json.submit.production.android ||= {};
          Object.assign(json.submit.production.android, {
            track: 'production',
            releaseStatus: 'completed',
            changesNotSentForReview: false
          });
          fs.writeFileSync(p, JSON.stringify(json, null, 2) + '\n');
          NODE
      - name: Submit latest Android build to Google Play production
        run: npx --yes eas-cli@latest submit --platform android --latest --profile production --non-interactive --wait
