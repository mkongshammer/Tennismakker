name: Refresh iOS Sign in with Apple Profile

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/eas-ios-credentials-build5.yml"

permissions:
  contents: read

jobs:
  refresh-build-submit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
      EXPO_ASC_API_KEY_PATH: /tmp/AuthKey.p8
      EXPO_ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      EXPO_ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      EXPO_APPLE_TEAM_ID: 28H9663B4V
      EXPO_APPLE_TEAM_TYPE: INDIVIDUAL
      CI: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install dependencies and expect
        run: |
          npm ci
          sudo apt-get update -qq
          sudo apt-get install -y -qq expect
      - name: Configure App Store Connect API key
        run: |
          test -n "$EXPO_TOKEN"
          test -n "$ASC_KEY_ID"
          test -n "$ASC_ISSUER_ID"
          test -n "$ASC_PRIVATE_KEY"
          printf '%s' "$ASC_PRIVATE_KEY" > /tmp/AuthKey.p8
          chmod 600 /tmp/AuthKey.p8
          npx --yes eas-cli@latest whoami
      - name: Link existing EAS project
        run: npx --yes eas-cli@latest init --id 620ef3a3-d92c-4241-86bb-511817c9d3cb --non-interactive
      - name: Verify Sign in with Apple entitlement
        run: |
          npx expo config --type introspect --json > /tmp/expo-introspect.json
          node - <<'NODE'
          const fs = require('fs');
          const cfg = JSON.parse(fs.readFileSync('/tmp/expo-introspect.json','utf8'));
          const ent = cfg.ios?.entitlements || {};
          const value = ent['com.apple.developer.applesignin'];
          console.log('com.apple.developer.applesignin =', JSON.stringify(value));
          if (!value) throw new Error('Sign in with Apple entitlement missing from Expo introspection');
          NODE
      - name: Regenerate iOS provisioning profile
        run: |
          cat > /tmp/refresh-ios-profile.exp <<'EXPECT'
          log_user 1
          set timeout 900
          spawn npx --yes eas-cli@latest credentials:configure-build -p ios -e production
          expect {
            -nocase -re {maximum number of distribution certificates} {
              puts "SAFETY_STOP: Apple certificate limit reached. No certificates were revoked automatically."
              exit 41
            }
            -nocase -re {select certificates to revoke} {
              puts "SAFETY_STOP: Refusing to revoke Apple certificates automatically."
              exit 42
            }
            -nocase -re {do you want to log in to your apple account.*\?} {
              puts "AUTO: authenticate using configured ASC API key"
              send "\r"
              exp_continue
            }
            -nocase -re {reuse this distribution certificate.*\?} {
              puts "AUTO: reuse existing distribution certificate"
              send "y\r"
              exp_continue
            }
            -nocase -re {select the ios distribution certificate to use} {
              puts "AUTO: select first distribution certificate"
              send "\r"
              exp_continue
            }
            -nocase -re {would you like to reuse the original profile.*\?} {
              puts "AUTO: force a fresh provisioning profile for updated entitlements"
              send "n\r"
              exp_continue
            }
            -nocase -re {generate a new .*provisioning profile.*\?} {
              puts "AUTO: generate new provisioning profile"
              send "y\r"
              exp_continue
            }
            -nocase -re {select an apple team} {
              puts "AUTO: select Apple team"
              send "\r"
              exp_continue
            }
            -re {[^\r\n]{1,220}\?} {
              puts "AUTO_DEFAULT_PROMPT: $expect_out(0,string)"
              send "\r"
              exp_continue
            }
            eof {
              catch wait result
              set exit_status [lindex $result 3]
              exit $exit_status
            }
            timeout {
              puts "Timed out refreshing iOS credentials."
              exit 43
            }
          }
          EXPECT
          expect /tmp/refresh-ios-profile.exp
      - name: Build fresh iOS production binary
        run: npx --yes eas-cli@latest build --platform ios --profile production --non-interactive --wait
      - name: Configure submit profile and submit latest build
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const p = 'eas.json';
          const json = JSON.parse(fs.readFileSync(p, 'utf8'));
          json.submit ||= {};
          json.submit.production ||= {};
          json.submit.production.ios ||= {};
          Object.assign(json.submit.production.ios, {
            ascAppId: '6820186123',
            ascApiKeyPath: '/tmp/AuthKey.p8',
            ascApiKeyIssuerId: process.env.ASC_ISSUER_ID,
            ascApiKeyId: process.env.ASC_KEY_ID
          });
          fs.writeFileSync(p, JSON.stringify(json, null, 2) + '\n');
          NODE
          npx --yes eas-cli@latest submit --platform ios --latest --profile production --non-interactive --wait
