name: Force Fresh iOS Provisioning Profile and Rebuild

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/eas-ios-credentials-build5.yml"

permissions:
  contents: read

jobs:
  refresh-build-submit:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
      EXPO_ASC_API_KEY_PATH: /tmp/AuthKey.p8
      EXPO_ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      EXPO_ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      EXPO_APPLE_TEAM_ID: 28H9663B4V
      EXPO_APPLE_TEAM_TYPE: INDIVIDUAL
      CI: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies and expect
        run: |
          npm ci
          sudo apt-get update -qq
          sudo apt-get install -y -qq expect

      - name: Configure EAS and App Store Connect authentication
        run: |
          test -n "$EXPO_TOKEN"
          test -n "$ASC_KEY_ID"
          test -n "$ASC_ISSUER_ID"
          test -n "$ASC_PRIVATE_KEY"
          printf '%s' "$ASC_PRIVATE_KEY" > /tmp/AuthKey.p8
          chmod 600 /tmp/AuthKey.p8
          npx --yes eas-cli@latest whoami
          npx --yes eas-cli@latest init --id 620ef3a3-d92c-4241-86bb-511817c9d3cb --non-interactive

      - name: Verify Sign in with Apple is enabled
        run: |
          npx expo config --type introspect --json > /tmp/expo-introspect.json
          node - <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const cfg = JSON.parse(fs.readFileSync('/tmp/expo-introspect.json','utf8'));
          const value = cfg.ios?.entitlements?.['com.apple.developer.applesignin'];
          if (!value) throw new Error('Sign in with Apple entitlement missing locally');
          const keyId = process.env.ASC_KEY_ID;
          const issuerId = process.env.ASC_ISSUER_ID;
          const privateKey = fs.readFileSync('/tmp/AuthKey.p8','utf8');
          const b64 = x => Buffer.from(JSON.stringify(x)).toString('base64url');
          const now = Math.floor(Date.now()/1000);
          const unsigned = `${b64({alg:'ES256',kid:keyId,typ:'JWT'})}.${b64({iss:issuerId,iat:now-5,exp:now+900,aud:'appstoreconnect-v1'})}`;
          const sig = crypto.sign('sha256', Buffer.from(unsigned), {key:privateKey,dsaEncoding:'ieee-p1363'}).toString('base64url');
          const token = `${unsigned}.${sig}`;
          (async () => {
            const r = await fetch('https://api.appstoreconnect.apple.com/v1/bundleIds/5CXM543J99/bundleIdCapabilities', {headers:{Authorization:`Bearer ${token}`}});
            const body = await r.json();
            if (!r.ok) throw new Error(`Unable to read Apple capabilities: ${r.status}`);
            if (!(body.data || []).some(x => x?.attributes?.capabilityType === 'APPLE_ID_AUTH')) throw new Error('APPLE_ID_AUTH is not enabled');
            console.log('Apple Sign in capability is enabled.');
          })().catch(e => { console.error(e); process.exit(1); });
          NODE

      - name: Remove stale provisioning profile from EAS only
        run: |
          cat > /tmp/remove-profile.exp <<'EXPECT'
          log_user 1
          set timeout 300
          spawn npx --yes eas-cli@latest credentials -p ios

          expect -re {Which build profile do you want to configure\?}
          send -- "\033\[B\r"

          expect -re {What do you want to do\?}
          send -- "\r"

          expect -re {What do you want to do\?}
          send -- "\033\[B\033\[B\033\[B\033\[B\r"

          expect {
            -nocase -re {Which target do you want to configure} {
              send -- "\r"
              exp_continue
            }
            -nocase -re {Delete the provisioning profile associated with.*\?} {
              send -- "y\r"
              exp_continue
            }
            -nocase -re {Successfully removed provisioning profiles} {
              puts "STALE_PROFILE_REMOVED"
              exit 0
            }
            -nocase -re {No provisioning profile associated} {
              puts "NO_STALE_PROFILE_PRESENT"
              exit 0
            }
            timeout {
              puts "Timed out while removing stale provisioning profile."
              exit 45
            }
            eof {
              catch wait result
              set status [lindex $result 3]
              exit $status
            }
          }
          EXPECT
          expect /tmp/remove-profile.exp

      - name: Create new provisioning profile with current entitlements
        run: |
          cat > /tmp/create-profile.exp <<'EXPECT'
          log_user 1
          set timeout 600
          spawn npx --yes eas-cli@latest credentials:configure-build -p ios -e production
          expect {
            -nocase -re {maximum number of distribution certificates} {
              puts "SAFETY_STOP: Distribution certificate limit reached; no certificate was revoked."
              exit 41
            }
            -nocase -re {select certificates to revoke} {
              puts "SAFETY_STOP: Refusing to revoke distribution certificates."
              exit 42
            }
            -nocase -re {reuse this distribution certificate} {
              send -- "y\r"
              exp_continue
            }
            -nocase -re {select the ios distribution certificate to use} {
              send -- "\r"
              exp_continue
            }
            -nocase -re {generate a new .*provisioning profile} {
              send -- "y\r"
              exp_continue
            }
            -nocase -re {select an apple team} {
              send -- "\r"
              exp_continue
            }
            -nocase -re {All credentials are ready to build} {
              puts "FRESH_PROFILE_READY"
              exp_continue
            }
            eof {
              catch wait result
              set status [lindex $result 3]
              exit $status
            }
            timeout {
              puts "Timed out while creating fresh provisioning profile."
              exit 43
            }
          }
          EXPECT
          expect /tmp/create-profile.exp

      - name: Build fresh iOS production binary
        run: npx --yes eas-cli@latest build --platform ios --profile production --non-interactive --wait

      - name: Submit latest iOS build to App Store Connect
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const p = 'eas.json';
          const json = JSON.parse(fs.readFileSync(p, 'utf8'));
          json.submit ||= {};
          json.submit.production ||= {};
          json.submit.production.ios ||= {};
          Object.assign(json.submit.production.ios, {
            ascAppId: '6820186123',
            ascApiKeyPath: '/tmp/AuthKey.p8',
            ascApiKeyIssuerId: process.env.ASC_ISSUER_ID,
            ascApiKeyId: process.env.ASC_KEY_ID
          });
          fs.writeFileSync(p, JSON.stringify(json, null, 2) + '\n');
          NODE
          npx --yes eas-cli@latest submit --platform ios --latest --profile production --non-interactive --wait

# Provisioning-profile menu automation fixed after Apple Sign-In was enabled.
