name: Enable Apple Sign-In and Rebuild iOS

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/eas-ios-credentials-build5.yml"

permissions:
  contents: read

jobs:
  enable-refresh-build-submit:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
      EXPO_ASC_API_KEY_PATH: /tmp/AuthKey.p8
      EXPO_ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      EXPO_ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      EXPO_APPLE_TEAM_ID: 28H9663B4V
      EXPO_APPLE_TEAM_TYPE: INDIVIDUAL
      CI: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install dependencies and expect
        run: |
          npm ci
          sudo apt-get update -qq
          sudo apt-get install -y -qq expect
      - name: Configure credentials
        run: |
          test -n "$EXPO_TOKEN"
          test -n "$ASC_KEY_ID"
          test -n "$ASC_ISSUER_ID"
          test -n "$ASC_PRIVATE_KEY"
          printf '%s' "$ASC_PRIVATE_KEY" > /tmp/AuthKey.p8
          chmod 600 /tmp/AuthKey.p8
          npx --yes eas-cli@latest whoami
          npx --yes eas-cli@latest init --id 620ef3a3-d92c-4241-86bb-511817c9d3cb --non-interactive
      - name: Verify local Apple Sign-In entitlement
        run: |
          npx expo config --type introspect --json > /tmp/expo-introspect.json
          node - <<'NODE'
          const fs = require('fs');
          const cfg = JSON.parse(fs.readFileSync('/tmp/expo-introspect.json','utf8'));
          const value = cfg.ios?.entitlements?.['com.apple.developer.applesignin'];
          console.log('Local Sign in with Apple entitlement:', JSON.stringify(value));
          if (!value) throw new Error('Sign in with Apple entitlement missing locally');
          NODE
      - name: Enable Sign in with Apple directly through Apple API
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const keyId = process.env.ASC_KEY_ID;
          const issuerId = process.env.ASC_ISSUER_ID;
          const privateKey = fs.readFileSync('/tmp/AuthKey.p8','utf8');
          const bundleIdResource = '5CXM543J99';
          const b64 = (x) => Buffer.from(JSON.stringify(x)).toString('base64url');
          const now = Math.floor(Date.now()/1000);
          const unsigned = `${b64({alg:'ES256',kid:keyId,typ:'JWT'})}.${b64({iss:issuerId,iat:now-5,exp:now+900,aud:'appstoreconnect-v1'})}`;
          const signature = crypto.sign('sha256', Buffer.from(unsigned), {key: privateKey, dsaEncoding:'ieee-p1363'}).toString('base64url');
          const token = `${unsigned}.${signature}`;
          const headers = {Authorization:`Bearer ${token}`,'Content-Type':'application/json'};
          const base = 'https://api.appstoreconnect.apple.com/v1';

          async function request(url, options={}) {
            const r = await fetch(url, {...options, headers:{...headers,...options.headers}});
            const text = await r.text();
            let body = null;
            try { body = text ? JSON.parse(text) : null; } catch { body = text; }
            return {r, body};
          }

          const current = await request(`${base}/bundleIds/${bundleIdResource}/bundleIdCapabilities`);
          if (!current.r.ok) {
            console.error('Could not read bundle capabilities:', current.r.status, JSON.stringify(current.body));
            process.exit(2);
          }
          const enabled = (current.body?.data || []).some(x => x?.attributes?.capabilityType === 'APPLE_ID_AUTH');
          if (enabled) {
            console.log('Sign in with Apple capability already enabled on Apple bundle ID.');
            process.exit(0);
          }

          const payload = {
            data: {
              type: 'bundleIdCapabilities',
              attributes: { capabilityType: 'APPLE_ID_AUTH' },
              relationships: { bundleId: { data: { type: 'bundleIds', id: bundleIdResource } } }
            }
          };
          const created = await request(`${base}/bundleIdCapabilities`, {method:'POST', body:JSON.stringify(payload)});
          if (!(created.r.status === 201 || created.r.status === 409)) {
            console.error('Failed to enable Sign in with Apple:', created.r.status, JSON.stringify(created.body));
            process.exit(3);
          }
          console.log(created.r.status === 201 ? 'Enabled Sign in with Apple capability.' : 'Capability already exists (409).');
          NODE
      - name: Generate a fresh provisioning profile
        env:
          EXPO_NO_CAPABILITY_SYNC: "1"
        run: |
          cat > /tmp/refresh-profile.exp <<'EXPECT'
          log_user 1
          set timeout 900
          spawn npx --yes eas-cli@latest credentials:configure-build -p ios -e production
          expect {
            -nocase -re {maximum number of distribution certificates} {
              puts "SAFETY_STOP: Apple certificate limit reached."
              exit 41
            }
            -nocase -re {select certificates to revoke} {
              puts "SAFETY_STOP: Refusing to revoke Apple certificates automatically."
              exit 42
            }
            -nocase -re {reuse this distribution certificate} {
              send "y\r"
              exp_continue
            }
            -nocase -re {select the ios distribution certificate to use} {
              send "\r"
              exp_continue
            }
            -nocase -re {reuse the original profile} {
              puts "FORCE_NEW_PROFILE"
              send "n\r"
              exp_continue
            }
            -nocase -re {generate a new .*provisioning profile} {
              puts "GENERATE_NEW_PROFILE"
              send "y\r"
              exp_continue
            }
            -nocase -re {select an apple team} {
              send "\r"
              exp_continue
            }
            eof {
              catch wait result
              set exit_status [lindex $result 3]
              exit $exit_status
            }
            timeout {
              puts "Timed out refreshing provisioning profile."
              exit 43
            }
          }
          EXPECT
          expect /tmp/refresh-profile.exp
      - name: Build fresh iOS production binary
        env:
          EXPO_NO_CAPABILITY_SYNC: "1"
        run: npx --yes eas-cli@latest build --platform ios --profile production --non-interactive --wait
      - name: Submit latest iOS build to App Store Connect
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const p = 'eas.json';
          const json = JSON.parse(fs.readFileSync(p, 'utf8'));
          json.submit ||= {};
          json.submit.production ||= {};
          json.submit.production.ios ||= {};
          Object.assign(json.submit.production.ios, {
            ascAppId: '6820186123',
            ascApiKeyPath: '/tmp/AuthKey.p8',
            ascApiKeyIssuerId: process.env.ASC_ISSUER_ID,
            ascApiKeyId: process.env.ASC_KEY_ID
          });
          fs.writeFileSync(p, JSON.stringify(json, null, 2) + '\n');
          NODE
          npx --yes eas-cli@latest submit --platform ios --latest --profile production --non-interactive --wait
