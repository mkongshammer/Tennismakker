name: Update Mobile Legal Links

on:
  push:
    branches:
      - brand/oauth-and-app-icons
    paths:
      - ".github/workflows/update-legal-links.yml"

permissions:
  contents: write

jobs:
  update-links:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: brand/oauth-and-app-icons
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Use international legal URLs in mobile app
        run: |
          sed -i 's#https://racketbuddy.app/privatliv#https://racketbuddy.app/privacy#g' mobile/src/screens/LoginScreen.js mobile/src/screens/ProfileScreen.js
          sed -i 's#https://racketbuddy.app/vilkaar#https://racketbuddy.app/terms#g' mobile/src/screens/LoginScreen.js mobile/src/screens/ProfileScreen.js
          grep -n 'PRIVACY_URL\|TERMS_URL' mobile/src/screens/LoginScreen.js mobile/src/screens/ProfileScreen.js
      - name: Validate mobile
        working-directory: mobile
        run: |
          npm ci
          npm test
          npx expo-doctor
      - name: Commit legal link update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/src/screens/LoginScreen.js mobile/src/screens/ProfileScreen.js
          git commit -m "Use English privacy and terms URLs in mobile app"
          git push origin HEAD:brand/oauth-and-app-icons
