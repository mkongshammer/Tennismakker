name: Generate RacketBuddy Brand Assets

on:
  push:
    branches:
      - brand/oauth-and-app-icons
    paths:
      - "src/app/icon.svg"
      - "src/app/(legal)/privacy/page.tsx"
      - "src/app/(legal)/terms/page.tsx"
      - ".github/workflows/brand-assets.yml"

permissions:
  contents: write

jobs:
  generate-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: brand/oauth-and-app-icons
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
      - name: Generate app and web icon assets
        run: |
          magick -background none src/app/icon.svg -resize 1024x1024 mobile/assets/icon.png
          magick -background none src/app/icon.svg -resize 1024x1024 mobile/assets/adaptive-icon.png
          magick -background none src/app/icon.svg -resize 1024x1024 mobile/assets/splash-icon.png
          magick -background none src/app/icon.svg -resize 256x256 mobile/assets/favicon.png
          magick -background none src/app/icon.svg -resize 512x512 src/app/icon.png
          magick -background none src/app/icon.svg -resize 180x180 src/app/apple-icon.png
          test $(stat -c%s mobile/assets/icon.png) -lt 1048576
      - name: Validate backend and legal routes
        run: |
          npm ci
          npm test
          npx tsc --noEmit
      - name: Validate mobile project
        working-directory: mobile
        run: |
          npm ci
          npm test
          npx expo-doctor
          npx expo prebuild --clean --platform android --no-install
          npx expo prebuild --clean --platform ios --no-install
      - name: Commit generated icon assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/assets/icon.png mobile/assets/adaptive-icon.png mobile/assets/splash-icon.png mobile/assets/favicon.png src/app/icon.png src/app/apple-icon.png
          if git diff --cached --quiet; then
            echo "Brand assets already up to date"
          else
            git commit -m "Generate new RacketBuddy app icon assets"
            git push origin HEAD:brand/oauth-and-app-icons
          fi
