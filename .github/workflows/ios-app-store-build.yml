name: iOS App Store build

# Builds the iOS app from main in the original Expo project (where the Apple
# certificates and the App Store Connect key live) and uploads it to App Store
# Connect. It does not submit for review; that is done on the version page.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ios-app-store-build.yml"

permissions:
  contents: read

jobs:
  ios:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
      EXPO_ASC_API_KEY_PATH: /tmp/AuthKey.p8
      EXPO_ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      EXPO_ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      EXPO_APPLE_TEAM_ID: 28H9663B4V
      EXPO_APPLE_TEAM_TYPE: INDIVIDUAL
      CI: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install dependencies
        run: npm ci
      - name: Configure App Store Connect key and the original Expo project
        run: |
          printf '%s' "$ASC_PRIVATE_KEY" > /tmp/AuthKey.p8
          chmod 600 /tmp/AuthKey.p8
          npx --yes eas-cli@latest whoami
          node - <<'NODE'
          const fs = require('fs');
          const app = JSON.parse(fs.readFileSync('app.json', 'utf8'));
          delete app.expo.owner;
          app.expo.extra = app.expo.extra || {};
          app.expo.extra.eas = { projectId: '620ef3a3-d92c-4241-86bb-511817c9d3cb' };
          if (app.expo.ios.bundleIdentifier !== 'dk.racketbuddy.app' || !app.expo.ios.usesAppleSignIn) throw Error('Sign in with Apple must be on');
          fs.writeFileSync('app.json', JSON.stringify(app, null, 2) + '\n');
          const eas = JSON.parse(fs.readFileSync('eas.json', 'utf8'));
          eas.submit = eas.submit || {};
          eas.submit.production = eas.submit.production || {};
          eas.submit.production.ios = { ascAppId: '6820186123', ascApiKeyPath: '/tmp/AuthKey.p8', ascApiKeyIssuerId: process.env.ASC_ISSUER_ID, ascApiKeyId: process.env.ASC_KEY_ID };
          fs.writeFileSync('eas.json', JSON.stringify(eas, null, 2) + '\n');
          NODE
          npx --yes eas-cli@latest init --id 620ef3a3-d92c-4241-86bb-511817c9d3cb --non-interactive
      - name: Build iOS production binary
        run: |
          npx --yes eas-cli@latest build --platform ios --profile production --non-interactive --wait --json > build.json
          node -e "const b=JSON.parse(require('fs').readFileSync('build.json','utf8'))[0]; console.log('::notice::BUILD '+b.id+' buildNumber '+b.appBuildVersion+' version '+b.appVersion)"
      - name: Upload to App Store Connect
        run: |
          ID=$(node -e "console.log(JSON.parse(require('fs').readFileSync('build.json','utf8'))[0].id)")
          npx --yes eas-cli@latest submit --platform ios --id "$ID" --profile production --non-interactive --wait
