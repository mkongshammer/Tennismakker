name: Google Play First Internal Submit

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/google-play-first-internal-submit.yml"

permissions:
  contents: read

jobs:
  submit-internal:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      CI: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install dependencies
        run: npm ci
      - name: Verify Expo authentication
        run: |
          test -n "$EXPO_TOKEN"
          npx --yes eas-cli@latest whoami
      - name: Link EAS project
        run: npx --yes eas-cli@latest init --id 620ef3a3-d92c-4241-86bb-511817c9d3cb --non-interactive
      - name: Configure first Google Play internal release
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const p = 'eas.json';
          const json = JSON.parse(fs.readFileSync(p, 'utf8'));
          json.submit ||= {};
          json.submit['first-internal'] = {
            android: {
              track: 'internal',
              releaseStatus: 'completed',
              changesNotSentForReview: false
            }
          };
          fs.writeFileSync(p, JSON.stringify(json, null, 2) + '\n');
          NODE
      - name: Submit existing Android build to internal testing
        run: npx --yes eas-cli@latest submit --platform android --id be255d4f-02f7-44d8-ae8c-1155f78e54f3 --profile first-internal --non-interactive --wait --verbose-fastlane
