name: Mobile store readiness

on:
  pull_request:
    paths:
      - "mobile/**"
      - "src/app/api/v1/me/**"
      - "src/app/(legal)/**"
      - ".github/workflows/mobile-store-check.yml"
  push:
    branches:
      - main
    paths:
      - "mobile/**"
      - "src/app/api/v1/me/**"
      - "src/app/(legal)/**"
      - ".github/workflows/mobile-store-check.yml"

jobs:
  validate-mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.4"
      - name: Install dependencies
        run: npm ci
      - name: Expo doctor
        run: npx expo-doctor
      - name: Export iOS, Android and web bundles
        run: npx expo export --platform all --output-dir /tmp/racketbuddy-bundles
