name: Mobile store readiness

on:
  pull_request:
    paths:
      - "mobile/**"
      - "src/app/api/v1/**"
      - "src/lib/messages.ts"
      - "src/lib/moderation.ts"
      - "src/lib/swipe.ts"
      - "src/app/(legal)/**"
      - ".github/workflows/mobile-store-check.yml"
  push:
    branches:
      - main
    paths:
      - "mobile/**"
      - "src/app/api/v1/**"
      - "src/lib/messages.ts"
      - "src/lib/moderation.ts"
      - "src/lib/swipe.ts"
      - "src/app/(legal)/**"
      - ".github/workflows/mobile-store-check.yml"

jobs:
  validate-mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.4"
      - name: Install dependencies
        run: npm install
      - name: Store configuration check
        run: npm run store:check
      - name: Expo doctor
        run: npm run doctor
      - name: Export web bundle
        run: npx expo export --platform web --output-dir /tmp/racketbuddy-web

  validate-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.4"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: TypeScript check
        run: npx tsc --noEmit
