name: Prepare Mobile Auth Feature

on:
  push:
    branches:
      - feature/mobile-auth-biometrics
    paths:
      - ".github/workflows/mobile-auth-prepare.yml"
      - "mobile/src/lib/api.js"
      - "mobile/src/lib/auth.js"
      - "mobile/src/lib/AppLock.js"
      - "mobile/src/screens/LoginScreen.js"
      - "src/app/api/v1/auth/**"
      - "src/lib/mobile-session.ts"

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/mobile-auth-biometrics
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Patch schema, regression tests and mobile API typo
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('prisma/schema.prisma')
          s = p.read_text()
          start = s.index('model User {')
          end = s.index('// ---------- Modul C: Klubber ----------')
          user = s[start:end]
          if 'googleSub' not in user:
              user = user.replace('  passwordHash     String\n', '  passwordHash     String\n  googleSub        String?   @unique\n  appleSub         String?   @unique\n')
          if 'mobileSessions' not in user:
              user = user.replace('  controlEvents    ClubControlEvent[]\n}', '  controlEvents    ClubControlEvent[]\n  mobileSessions   MobileSession[]\n}')
          if 'model MobileSession {' not in user:
              user = user.rstrip() + '''\n\nmodel MobileSession {\n  id         String   @id @default(cuid())\n  tokenHash  String   @unique\n  userId     String\n  user       User     @relation(fields: [userId], references: [id], onDelete: Cascade)\n  createdAt  DateTime @default(now())\n  lastUsedAt DateTime @default(now())\n\n  @@index([userId])\n}\n\n'''
          s = s[:start] + user + s[end:]
          p.write_text(s)

          api = Path('mobile/src/lib/api.js')
          a = api.read_text()
          a = a.replace('rebook:bookingId=>request("/bookings/rebook",{method:"POST"}),', 'rebook:bookingId=>request("/bookings/rebook",{method:"POST",body:{bookingId}}),')
          api.write_text(a)

          tests = Path('mobile/src/lib/screens.test.cjs')
          t = tests.read_text()
          t = t.replace(
              "'react-native': { Linking: {}, RefreshControl: 'RefreshControl', ScrollView: 'ScrollView', StyleSheet: { create: x => x }, Text: 'Text', View: 'View' },",
              "'react-native': { Linking: {}, Platform:{OS:'ios'}, RefreshControl: 'RefreshControl', ScrollView: 'ScrollView', StyleSheet: { create: x => x }, Text: 'Text', View: 'View' },"
          )
          marker = "    '../lib/auth': { useAuth: () => ({ user: { id: 'member', name: 'Test', level: 3 } }) },\n"
          if "../lib/AppLock': { useAppLock" not in t:
              t = t.replace(marker, marker + "    '../lib/AppLock': { useAppLock: () => ({ enabled:false, biometricLabel:'Face ID', enableBiometricLock:async()=>({ok:true}), disableBiometricLock:async()=>({ok:true}) }) },\n")
          login_marker = "    'react-native-safe-area-context':{useSafeAreaInsets:()=>({top:0,bottom:0})},\n"
          if "../lib/SocialAuthButtons':{SocialAuthButtons" not in t:
              t = t.replace(login_marker, "    '../lib/SocialAuthButtons':{SocialAuthButtons:'SocialAuthButtons'},\n" + login_marker)
          t = t.replace("assert.equal(tree.root.findAllByType('Button')[0].props.title,'Log ind');", "assert.equal(tree.root.findAllByType('Button')[0].props.title,'Log ind med e-mail');")
          tests.write_text(t)
          PY
      - name: Install existing mobile dependencies
        working-directory: mobile
        run: npm ci
      - name: Install mobile native auth dependencies
        working-directory: mobile
        run: npx expo install expo-apple-authentication expo-local-authentication expo-secure-store @react-native-google-signin/google-signin
      - name: Format Prisma schema
        run: |
          npm ci
          npx prisma format
          npx prisma generate
      - name: Commit prepared feature files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prisma/schema.prisma mobile/package.json mobile/package-lock.json mobile/src/lib/api.js mobile/src/lib/screens.test.cjs
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Prepare schema and dependencies for mobile social auth"
            git push origin HEAD:feature/mobile-auth-biometrics
          fi
      - name: Validate backend tests
        run: npm test
      - name: Validate backend types
        run: npx tsc --noEmit
      - name: Validate Expo app
        working-directory: mobile
        run: |
          npm test
          npx expo-doctor
