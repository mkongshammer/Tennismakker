name: Validate Native Auth Prebuild

on:
  push:
    branches:
      - fix/android-google-expo-config
    paths:
      - ".github/workflows/validate-native-auth-prebuild.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci
      - name: Run mobile tests
        run: npm test
      - name: Validate Expo config
        run: npx expo-doctor
      - name: Prebuild Android native project
        run: npx expo prebuild --clean --platform android --no-install
      - name: Confirm Google native module is autolinkable
        run: node -e "require.resolve('@react-native-google-signin/google-signin/package.json'); console.log('Google Sign-In package available')"
      - name: Prebuild iOS native project
        run: npx expo prebuild --clean --platform ios --no-install
