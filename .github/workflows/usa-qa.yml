name: USA regression QA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'shared/**'
      - 'scripts/**'
      - 'prisma/**'
      - 'mobile/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/usa-qa.yml'

permissions:
  contents: read

jobs:
  web-and-market:
    name: Web, market and onboarding
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # A real Postgres for the onboarding suite. It used to run on PGlite over
    # a socket server, whose single connection the runner kept dropping
    # part-way through — the job was red every day from 12 to 18 Nov while
    # every scenario passed. Locally the suite still uses PGlite and needs
    # nothing installed.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.4'
          cache: npm
      - run: npm ci
      - name: Unit and localization tests
        run: npm test
      - name: Club onboarding integration tests
        env:
          TEST_DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
        run: npm run test:onboarding
      - name: Production build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          # Build-only placeholders; the real values live in Render.
          AUTH_SECRET: ci-build-only-secret-0123456789abcdef
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:1/ci
        run: npm run build

  mobile:
    name: Mobile app
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.4'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - name: Mobile unit tests
        run: npm test
      - name: Expo dependency and config validation
        run: npx expo-doctor
      - name: Export iOS and Android bundles
        run: npx expo export --platform all --output-dir /tmp/racketbuddy-usa-qa
